<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 助手 · 数据查询与页面跳转</title>

  <!-- Markdown 渲染 + XSS 清洗 + 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --ink: #1a1d29;
      --ink-soft: #5b6172;
      --line: #e6e9f0;
      --brand: #4f6ef7;
      --brand-2: #7b5cf5;
      --brand-soft: #eef2ff;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(31, 45, 89, .08);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #e8ecff 0%, transparent 60%),
        radial-gradient(1000px 500px at 110% 10%, #f3e8ff 0%, transparent 55%),
        var(--bg);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 860px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    /* ---------- 头部 ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      flex: none;
      box-shadow: 0 6px 16px rgba(79, 110, 247, .35);
    }

    .title { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
    .subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #12a150;
      background: #e9f9f0;
      border: 1px solid #c9f0da;
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #12a150;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.85); }
    }

    /* ---------- 聊天区 ---------- */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 8px 4px 4px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb { background: #d4d9e6; border-radius: 8px; }
    #chat::-webkit-scrollbar-track { background: transparent; }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: rise .28s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      user-select: none;
    }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
    .msg.user .avatar { background: linear-gradient(135deg, #94a3b8, #64748b); }

    .body { max-width: min(78%, 620px); min-width: 0; }

    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.7;
      font-size: 15px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .msg.assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 4px 16px rgba(31, 45, 89, .06);
      border-top-left-radius: 4px;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border-top-right-radius: 4px;
      white-space: pre-wrap;
      box-shadow: 0 6px 18px rgba(79, 110, 247, .28);
    }

    /* ---------- 跳转卡片 ---------- */
    .nav-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 10px 14px;
      background: var(--brand-soft);
      border: 1px solid #d6e0ff;
      border-radius: 12px;
      color: #3346b8;
      font-weight: 500;
      font-size: 14px;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .nav-card:hover {
      background: #e3eaff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 110, 247, .2);
    }
    .nav-card .arrow { font-size: 15px; }
    .nav-card .url-hint {
      font-size: 11px;
      color: #8a95c9;
      font-weight: 400;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- Markdown 内容样式 ---------- */
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble p { margin: 8px 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      margin: 16px 0 8px;
      line-height: 1.35;
      font-weight: 600;
    }
    .bubble h1 { font-size: 19px; }
    .bubble h2 { font-size: 17px; }
    .bubble h3 { font-size: 15.5px; }
    .bubble h4 { font-size: 15px; }
    .bubble ul, .bubble ol { margin: 8px 0; padding-left: 22px; }
    .bubble li { margin: 4px 0; }
    .bubble li > p { margin: 2px 0; }
    .bubble a { color: var(--brand); text-decoration: none; border-bottom: 1px dashed rgba(79,110,247,.5); }
    .bubble a:hover { border-bottom-style: solid; }
    .bubble strong { font-weight: 600; }
    .bubble hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
    .bubble blockquote {
      margin: 10px 0;
      padding: 6px 14px;
      border-left: 3px solid #c9d4ff;
      background: #f8faff;
      color: #4a5169;
      border-radius: 0 8px 8px 0;
    }
    .bubble code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      background: #f1f3f9;
      border: 1px solid #e6e9f0;
      padding: 1px 6px;
      border-radius: 6px;
    }
    .bubble pre {
      margin: 12px 0;
      padding: 14px 16px;
      background: #f8f9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.6;
      display: block;
    }
    .bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 14px;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--line);
      padding: 8px 12px;
      text-align: left;
    }
    .bubble th { background: #f6f8fd; font-weight: 600; }
    .bubble tr:nth-child(even) td { background: #fbfcfe; }

    /* ---------- 打字指示器 ---------- */
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #b9c0d4;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: .16s; }
    .typing span:nth-child(3) { animation-delay: .32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ---------- 空状态 / 快捷示例 ---------- */
    .empty {
      margin: auto;
      text-align: center;
      max-width: 520px;
      padding: 20px;
      animation: rise .4s ease both;
    }
    .empty .big {
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      box-shadow: 0 12px 28px rgba(79, 110, 247, .3);
    }
    .empty h2 { font-size: 18px; margin: 0 0 8px; }
    .empty p { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .chip {
      padding: 9px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13.5px;
      color: #3a4157;
      cursor: pointer;
      transition: all .15s ease;
      box-shadow: 0 2px 8px rgba(31, 45, 89, .05);
    }
    .chip:hover {
      border-color: #c9d4ff;
      background: var(--brand-soft);
      color: #3346b8;
      transform: translateY(-1px);
    }

    /* ---------- 输入区 ---------- */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 140px;
      padding: 9px 8px;
      background: transparent;
      color: var(--ink);
    }
    #input::placeholder { color: #a3aab8; }

    #send {
      flex: none;
      width: 42px; height: 42px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 6px 16px rgba(79, 110, 247, .35);
    }
    #send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,110,247,.42); }
    #send:active:not(:disabled) { transform: translateY(0); }
    #send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .footnote {
      text-align: center;
      font-size: 11.5px;
      color: #9aa2b4;
      padding-bottom: 2px;
    }

    @media (max-width: 640px) {
      .app { padding: 10px; gap: 10px; }
      header { padding: 12px 14px; }
      .subtitle { display: none; }
      .body { max-width: 84%; }
      .bubble { font-size: 14.5px; padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">AI</div>
      <div>
        <div class="title">AI 助手</div>
        <div class="subtitle">数据查询 · 页面跳转 · 由 DeepSeek 驱动</div>
      </div>
      <div class="status"><span class="dot"></span>在线</div>
    </header>

    <div id="chat">
      <div class="empty" id="empty">
        <div class="big">✨</div>
        <h2>你好，我能帮你查数据、跳页面</h2>
        <p>试着问问我，或者点击下面的示例快速开始。</p>
        <div class="chips">
          <button class="chip">帮我查一下 2025 年 1 月有多少订单</button>
          <button class="chip">打开个人中心</button>
          <button class="chip">看一下 2025 年 1 月订单数，然后跳转到订单列表</button>
          <button class="chip">列出订单列表并说明状态</button>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" title="发送" aria-label="发送">➤</button>
    </div>
    <div class="footnote">内容由 AI 生成，请自行判断准确性 · Demo 数据为模拟</div>
  </div>

  <script>
    const chatEl  = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendEl  = document.getElementById("send");
    const emptyEl = document.getElementById("empty");
    let sessionId = null;
    let busy = false;

    /* ---------- Markdown 渲染（带 XSS 清洗） ---------- */
    function renderMarkdown(text) {
      if (window.marked && window.DOMPurify) {
        marked.setOptions({ gfm: true, breaks: true });
        const rawHtml = marked.parse(text);
        const safeHtml = DOMPurify.sanitize(rawHtml, {
          ADD_ATTR: ["target", "rel"]
        });
        const container = document.createElement("div");
        container.innerHTML = safeHtml;

        // 外链统一新窗口打开，并加固 rel
        container.querySelectorAll("a").forEach(a => {
          const href = a.getAttribute("href") || "";
          if (!/^https?:\/\//i.test(href)) {
            a.removeAttribute("href");
            return;
          }
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });

        // 代码高亮（可选，CDN 未加载时自动跳过）
        if (window.hljs) {
          container.querySelectorAll("pre code").forEach(el => {
            try { hljs.highlightElement(el); } catch (_) {}
          });
        }
        return container.innerHTML;
      }
      // CDN 加载失败时的兜底：纯文本
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    /* ---------- 只允许 http/https 的跳转链接 ---------- */
    function isSafeUrl(u) {
      try {
        const parsed = new URL(u, window.location.origin);
        return parsed.protocol === "http:" || parsed.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    /* ---------- 消息渲染 ---------- */
    function addMessage(role, text, navigation) {
      if (emptyEl && emptyEl.parentNode) emptyEl.remove();

      const msg = document.createElement("div");
      msg.className = "msg " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "我" : "AI";

      const body = document.createElement("div");
      body.className = "body";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }

      if (navigation && navigation.label) {
        const url = navigation.url || "";
        if (isSafeUrl(url)) {
          const card = document.createElement("a");
          card.className = "nav-card";
          card.href = url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "↗";

          const label = document.createElement("span");
          label.textContent = navigation.label;

          const hint = document.createElement("span");
          hint.className = "url-hint";
          hint.textContent = url;

          card.append(arrow, label, hint);
          bubble.appendChild(document.createElement("br"));
          bubble.appendChild(card);
        }
      }

      body.appendChild(bubble);
      msg.append(avatar, body);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addTyping() {
      const msg = document.createElement("div");
      msg.className = "msg assistant";
      msg.id = "typing-msg";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";

      const body = document.createElement("div");
      body.className = "body";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      body.appendChild(bubble);
      msg.append(avatar, body);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return msg;
    }

    /* ---------- 输入框自适应高度 ---------- */
    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    }
    inputEl.addEventListener("input", autoResize);

    /* ---------- 发送 ---------- */
    async function send(text) {
      text = (text ?? inputEl.value).trim();
      if (!text || busy) return;

      busy = true;
      sendEl.disabled = true;
      inputEl.value = "";
      autoResize();

      addMessage("user", text);
      const typingMsg = addTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        if (data.session_id) sessionId = data.session_id;

        typingMsg.remove();
        addMessage("assistant", data.reply || "(无回复)", data.navigation);
      } catch (e) {
        typingMsg.remove();
        addMessage("assistant", "⚠️ 请求失败：" + e.message + "\n\n请检查后端服务是否在运行，以及终端是否有报错。");
      } finally {
        busy = false;
        sendEl.disabled = false;
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", () => send());

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => send(chip.textContent));
    });

    inputEl.focus();
  </script>
</body>
</html>
