<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 助手 · 数据查询与页面跳转</title>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>

  <style>
    :root {
      --bg: #edf0f7;
      --panel: #ffffff;
      --ink: #20283a;
      --ink-soft: #69758b;
      --line: #e6eaf2;
      --brand: #5965e9;
      --brand-2: #8a67e8;
      --brand-soft: #f1f1ff;
      --radius: 18px;
      --shadow: 0 12px 35px rgba(40, 51, 84, .07);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 600px at 85% 0%, #e5e8ff 0%, transparent 70%),
        radial-gradient(900px 600px at 10% 100%, #e5edf7 0%, transparent 70%),
        var(--bg);
      display: flex;
      justify-content: center;
    }

    .layout {
      width: 100%;
      max-width: 1600px;
      height: 100dvh;
      display: flex;
      min-width: 0;
    }

    .sidebar {
      width: 250px;
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 20px 0 20px 24px;
      padding: 22px 14px 16px;
      background: linear-gradient(165deg, #242c48 0%, #1b2239 72%, #202740 100%);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 20px;
      color: #eff2ff;
      box-shadow: 0 18px 40px rgba(30, 37, 64, .18);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 11px; padding: 0 7px 17px; }
    .sidebar-brand-icon {
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      flex: none;
      border-radius: 12px;
      background: linear-gradient(145deg, #8992ff, #7861dc);
      color: #fff;
      box-shadow: 0 6px 16px rgba(106, 105, 235, .35);
    }
    .sidebar-brand-icon svg { width: 21px; height: 21px; }
    .sidebar-brand-name { font-size: 15px; font-weight: 700; letter-spacing: .04em; }
    .sidebar-brand-sub { margin-top: 3px; color: #a4aecb; font-size: 10px; letter-spacing: .12em; }
    .sidebar h2 {
      margin: 10px 8px 0;
      color: #aab4cf;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .05em;
    }
    .new-session, .session-item {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: #d3daf0;
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease;
    }
    .new-session {
      border-color: rgba(201, 207, 255, .17);
      background: rgba(255, 255, 255, .09);
      color: #fff;
      font-weight: 600;
    }
    .new-session:hover:not(:disabled) { background: rgba(255, 255, 255, .16); }
    .session-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .session-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-item::before { content: "◷"; margin-right: 9px; color: #a8b1d1; }
    .session-item:hover, .session-item.active {
      background: rgba(159, 170, 255, .14);
      border-color: rgba(174, 182, 255, .1);
      color: #fff;
    }
    .session-item.active::before { color: #b6baff; }
    .session-item:disabled, .new-session:disabled { opacity: .6; cursor: wait; }
    .session-status { color: #aab4cf; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; padding: 0 8px; }
    .sidebar-footer {
      margin-top: auto;
      padding: 14px 8px 2px;
      border-top: 1px solid rgba(255, 255, 255, .09);
      color: #aab4cf;
      font-size: 11px;
      line-height: 1.6;
    }

    /* ---------- 整体容器（加宽） ---------- */
    .app {
      width: 100%;
      min-width: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 18px 18px;
      gap: 12px;
    }

    /* ---------- 头部 ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 76px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, .82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(145deg, #eff0ff, #e6e7ff);
      display: grid;
      place-items: center;
      color: #6269d9;
      font-weight: 700;
      font-size: 14px;
      flex: none;
      border: 1px solid #e1e3ff;
    }

    .title { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
    .subtitle { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #27835d;
      background: #eefaf4;
      border: 1px solid #d5f0e2;
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #45b982;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.85); }
    }

    /* ---------- 聊天区 ---------- */
    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px clamp(14px, 4vw, 56px) 20px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
      background: rgba(255, 255, 255, .58);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    #chat::-webkit-scrollbar { width: 8px; }
    #chat::-webkit-scrollbar-thumb { background: #d4d9e6; border-radius: 8px; }
    #chat::-webkit-scrollbar-track { background: transparent; }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: rise .28s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 12px;
      flex: none;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      user-select: none;
    }
    .msg.assistant .avatar { background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
    .msg.user .avatar { background: linear-gradient(135deg, #94a3b8, #64748b); }

    /* ---------- 气泡（加宽） ---------- */
    .body { max-width: min(72%, 900px); min-width: 0; }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.75;
      font-size: 15.5px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .msg.assistant .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 4px 18px rgba(39, 49, 80, .045);
      border-top-left-radius: 6px;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border-top-right-radius: 6px;
      white-space: pre-wrap;
      box-shadow: 0 7px 20px rgba(88, 98, 218, .2);
    }

    /* ---------- 跳转卡片 ---------- */
    .nav-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 11px 16px;
      background: var(--brand-soft);
      border: 1px solid #d6e0ff;
      border-radius: 12px;
      color: #3346b8;
      font-weight: 500;
      font-size: 14.5px;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .nav-card:hover {
      background: #e3eaff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 110, 247, .2);
    }
    .nav-card .arrow { font-size: 15px; }
    .nav-card .url-hint {
      font-size: 11.5px;
      color: #8a95c9;
      font-weight: 400;
      max-width: 380px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- Markdown 内容 ---------- */
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble p { margin: 9px 0; }
    .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
      margin: 18px 0 9px;
      line-height: 1.35;
      font-weight: 600;
    }
    .bubble h1 { font-size: 20px; }
    .bubble h2 { font-size: 18px; }
    .bubble h3 { font-size: 16px; }
    .bubble h4 { font-size: 15.5px; }
    .bubble ul, .bubble ol { margin: 9px 0; padding-left: 24px; }
    .bubble li { margin: 5px 0; }
    .bubble li > p { margin: 2px 0; }
    .bubble a { color: var(--brand); text-decoration: none; border-bottom: 1px dashed rgba(79,110,247,.5); }
    .bubble a:hover { border-bottom-style: solid; }
    .bubble strong { font-weight: 600; }
    .bubble hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
    .bubble blockquote {
      margin: 12px 0;
      padding: 8px 16px;
      border-left: 3px solid #c9d4ff;
      background: #f8faff;
      color: #4a5169;
      border-radius: 0 8px 8px 0;
    }
    .bubble code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13.5px;
      background: #f1f3f9;
      border: 1px solid #e6e9f0;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .bubble pre {
      margin: 14px 0;
      padding: 16px 18px;
      background: #f8f9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow-x: auto;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13.5px;
      line-height: 1.65;
      display: block;
    }
    .bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 14px 0;
      font-size: 14.5px;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--line);
      padding: 10px 14px;
      text-align: left;
    }
    .bubble th { background: #f6f8fd; font-weight: 600; }
    .bubble tr:nth-child(even) td { background: #fbfcfe; }

    /* ---------- 打字指示器 ---------- */
    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #b9c0d4;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: .16s; }
    .typing span:nth-child(3) { animation-delay: .32s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ---------- 空状态 ---------- */
    .empty {
      flex: 0 0 auto;
      margin: auto;
      text-align: center;
      width: min(100%, 660px);
      max-width: 660px;
      padding: 28px 0;
      animation: rise .4s ease both;
    }
    .empty .big {
      width: 68px; height: 68px;
      margin: 0 auto 20px;
      border-radius: 23px;
      background: linear-gradient(145deg, #6e7afa, #9b74e6);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 28px;
      box-shadow: 0 12px 30px rgba(98, 103, 226, .28), 0 0 0 8px #f1f1ff;
    }
    .empty-eyebrow { color: #777ee1; font-size: 11px; font-weight: 700; letter-spacing: .15em; margin-bottom: 12px; }
    .empty h2 { font-size: clamp(20px, 2.2vw, 26px); letter-spacing: -.03em; margin: 0 0 10px; }
    .empty p { color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; line-height: 1.7; }
    .suggestions-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: #7a8497;
      font-size: 12px;
      text-align: left;
    }
    .suggestions-heading::after { content: ""; height: 1px; flex: 1; background: #e8ebf3; }
    .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
    .chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 54px;
      padding: 12px 15px;
      background: rgba(255, 255, 255, .9);
      border: 1px solid #e9ecf4;
      border-radius: 13px;
      font: inherit;
      font-size: 13px;
      line-height: 1.5;
      text-align: left;
      color: #46516a;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 3px 12px rgba(40, 51, 84, .035);
    }
    .chip::after { content: "↗"; flex: none; color: #9da6c1; font-size: 15px; }
    .chip:hover {
      border-color: #cdd1fc;
      background: #fafaff;
      color: #4c55c5;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(89, 101, 233, .09);
    }

    /* ---------- 输入区 ---------- */
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      padding: 10px 12px 10px 16px;
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid #e6e9f4;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .composer:focus-within { border-color: #c6ccff; box-shadow: 0 0 0 3px rgba(89, 101, 233, .09), var(--shadow); }

    #input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      resize: none;
      font: inherit;
      font-size: 15.5px;
      line-height: 1.55;
      max-height: 160px;
      padding: 10px 10px;
      background: transparent;
      color: var(--ink);
    }
    #input::placeholder { color: #a3aab8; }

    #send {
      flex: none;
      width: 42px; height: 42px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .15s ease, box-shadow .15s ease, opacity .15s ease;
      box-shadow: 0 6px 14px rgba(89, 101, 233, .25);
    }
    #send:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,110,247,.42); }
    #send:active:not(:disabled) { transform: translateY(0); }
    #send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .footnote {
      text-align: center;
      font-size: 11.5px;
      color: #8994a8;
      padding-bottom: 2px;
    }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: 2px solid #7c87f2;
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* ---------- 超大屏（27寸 2K/4K）进一步铺开 ---------- */
    @media (min-width: 1800px) {
      .app { max-width: 1560px; padding: 24px 40px; }
      .body { max-width: min(70%, 1000px); }
      .bubble { font-size: 16px; line-height: 1.8; }
    }

    @media (max-width: 640px) {
      .sidebar { width: 92px; margin: 10px 0 10px 10px; padding: 12px 6px; gap: 10px; }
      .sidebar-brand { justify-content: center; padding: 0 0 8px; }
      .sidebar-brand-text, .sidebar-footer { display: none; }
      .key-hint { display: none; }
      .sidebar h2 { margin: 8px 4px 0; }
      .new-session, .session-item { padding: 9px 6px; font-size: 11px; }
      .session-item::before { margin-right: 4px; }
      .session-status { padding: 0 4px; font-size: 11px; }
      .app { padding: 10px; gap: 10px; }
      header { min-height: 58px; padding: 10px 12px; gap: 8px; }
      .logo { display: none; }
      .title { white-space: nowrap; }
      .subtitle { display: none; }
      .status { padding: 5px 8px; font-size: 10px; }
      #chat { padding: 20px 12px; }
      .empty { padding: 20px 0; }
      .empty .big { width: 54px; height: 54px; border-radius: 18px; margin-bottom: 16px; }
      .empty-eyebrow { font-size: 10px; letter-spacing: .08em; }
      .empty h2 { font-size: 18px; }
      .empty p { margin-bottom: 20px; font-size: 12px; }
      .chips { grid-template-columns: minmax(0, 1fr); }
      .chip { min-height: 46px; }
      .composer { padding: 8px; gap: 8px; }
      #input { font-size: 14px; padding: 8px; }
      #send { width: 38px; height: 38px; }
      .body { max-width: 86%; }
      .bubble { font-size: 14.5px; padding: 11px 14px; }
    }
  </style>
</head>
<body>
  <div class="layout">
  <aside class="sidebar" aria-label="历史会话">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5 13.9 9l6.6 3-6.6 2.3L12 21l-2-6.7L3.5 12 10 9 12 2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sidebar-brand-text">
        <div class="sidebar-brand-name">智能工作台</div>
        <div class="sidebar-brand-sub">AI WORKSPACE</div>
      </div>
    </div>
    <button class="new-session" id="new-session">＋ 新建会话</button>
    <h2>历史会话</h2>
    <div class="session-list" id="session-list"></div>
    <div class="session-status" id="session-status" aria-live="polite"></div>
    <div class="sidebar-footer">你的每一次探索，<br>都可以从这里继续。</div>
  </aside>
  <div class="app">
    <header>
      <div class="logo">AI</div>
      <div>
        <div class="title">AI 助手</div>
        <div class="subtitle">数据查询 · 页面跳转 · 由 DeepSeek 驱动</div>
      </div>
      <div class="status"><span class="dot"></span>在线</div>
    </header>

    <div id="chat">
      <div class="empty" id="empty">
        <div class="big">✨</div>
        <div class="empty-eyebrow">YOUR AI ASSISTANT</div>
        <h2>你好，今天需要什么帮助？</h2>
        <p>查询数据、打开页面，或告诉我你想完成的任务。</p>
        <div class="suggestions-heading">试试这些快捷操作</div>
        <div class="chips" id="suggestions" aria-live="polite">正在加载快捷操作…</div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入你的问题..." aria-label="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send" title="发送" aria-label="发送">➤</button>
    </div>
    <div class="footnote"><span class="key-hint">Enter 发送 · Shift+Enter 换行 · </span>内容由 AI 生成，请自行判断准确性</div>
  </div>
  </div>

  <script>
    const chatEl  = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendEl  = document.getElementById("send");
    const emptyEl = document.getElementById("empty");
    const suggestionsEl = document.getElementById("suggestions");
    const sessionListEl = document.getElementById("session-list");
    const sessionStatusEl = document.getElementById("session-status");
    const newSessionEl = document.getElementById("new-session");
    const CLIENT_ID_KEY = "ai-agent-client-id";
    const ACTIVE_SESSION_KEY = "ai-agent-active-session";
    let clientId = null;
    let sessions = [];
    let sessionId = null;
    let busy = false;
    let extensionReady = false;

    window.addEventListener("message", event => {
      if (event.source !== window || event.origin !== location.origin ||
          event.data?.source !== "ai-agent-extension") return;
      if (event.data.type === "ready") {
        extensionReady = true;
      } else if (event.data.type === "navigation-status" && event.data.message) {
        addMessage("assistant", event.data.message);
      }
    });
    window.postMessage({ source: "ai-agent", type: "ping" }, location.origin);

    function setBusy(value) {
      busy = value;
      sendEl.disabled = value || !clientId;
      newSessionEl.disabled = value;
      sessionListEl.querySelectorAll("button").forEach(button => button.disabled = value);
    }

    function renderSessions() {
      sessionListEl.replaceChildren();
      sessions.forEach(session => {
        const button = document.createElement("button");
        button.className = "session-item" + (session.id === sessionId ? " active" : "");
        button.textContent = session.title;
        button.title = session.title;
        button.disabled = busy;
        if (session.id === sessionId) button.setAttribute("aria-current", "true");
        button.addEventListener("click", () => selectSession(session.id));
        sessionListEl.appendChild(button);
      });
      sessionStatusEl.textContent = sessions.length ? "" : "暂无历史会话";
    }

    async function refreshSessions() {
      const response = await fetch("/api/sessions", { headers: { "X-Client-Id": clientId } });
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (!Array.isArray(data.sessions)) throw new Error("会话列表格式无效");
      sessions = data.sessions;
      renderSessions();
    }

    async function selectSession(id) {
      if (busy) return;
      setBusy(true);
      try {
        const response = await fetch("/api/sessions/" + encodeURIComponent(id), {
          headers: { "X-Client-Id": clientId }
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!Array.isArray(data.messages)) throw new Error("会话内容格式无效");
        sessionId = id;
        localStorage.setItem(ACTIVE_SESSION_KEY, id);
        chatEl.replaceChildren();
        data.messages.forEach(message => {
          if ((message.role === "user" || message.role === "assistant") &&
              typeof message.content === "string") {
            addMessage(message.role, message.content, message.navigation);
          }
        });
        if (!data.messages.length) chatEl.appendChild(emptyEl);
        renderSessions();
      } catch (error) {
        sessionStatusEl.textContent = "加载会话失败：" + error.message;
      } finally {
        setBusy(false);
      }
    }

    function newSession() {
      if (busy || !clientId) return;
      sessionId = null;
      localStorage.removeItem(ACTIVE_SESSION_KEY);
      chatEl.replaceChildren(emptyEl);
      renderSessions();
      loadSuggestions();
      inputEl.focus();
    }

    async function initializeSessions() {
      try {
        let storedClientId = localStorage.getItem(CLIENT_ID_KEY);
        if (!storedClientId || !/^[a-f0-9]{64}$/.test(storedClientId)) {
          const bytes = crypto.getRandomValues(new Uint8Array(32));
          storedClientId = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          localStorage.setItem(CLIENT_ID_KEY, storedClientId);
        }
        clientId = storedClientId;
        await refreshSessions();
        const activeId = localStorage.getItem(ACTIVE_SESSION_KEY);
        if (activeId && sessions.some(session => session.id === activeId)) {
          setBusy(false);
          await selectSession(activeId);
        } else if (activeId) {
          localStorage.removeItem(ACTIVE_SESSION_KEY);
        }
      } catch (error) {
        sessionStatusEl.textContent = "加载历史会话失败：" + error.message;
      } finally {
        setBusy(false);
      }
    }

    async function loadSuggestions() {
      try {
        const response = await fetch("/api/suggestions");
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        if (!Array.isArray(data.suggestions)) throw new Error("返回格式无效");
        suggestionsEl.replaceChildren();
        data.suggestions.forEach(text => {
          if (typeof text !== "string" || !text.trim()) return;
          const chip = document.createElement("button");
          chip.className = "chip";
          chip.textContent = text;
          chip.addEventListener("click", () => send(text));
          suggestionsEl.appendChild(chip);
        });
        if (!suggestionsEl.children.length) suggestionsEl.textContent = "暂无快捷操作";
      } catch (error) {
        suggestionsEl.textContent = "快捷操作加载失败：" + error.message;
      }
    }

    function openNavigation(navigation) {
      if (!navigation || !isSafeUrl(navigation.url)) return;
      if (extensionReady) {
        window.postMessage({
          source: "ai-agent",
          type: "navigate",
          url: navigation.url,
          label: navigation.label
        }, location.origin);
      } else {
        const opened = window.open(navigation.url, "_blank");
        if (!opened) {
          addMessage("assistant", "浏览器可能拦截了自动打开，请点击上方页面链接。安装助手浏览器扩展后可复用标签页并处理登录。");
        } else {
          opened.opener = null;
        }
      }
    }

    /* ---------- Markdown 渲染（带 XSS 清洗） ---------- */
    function renderMarkdown(text) {
      if (window.marked && window.DOMPurify) {
        marked.setOptions({ gfm: true, breaks: true });
        const rawHtml = marked.parse(text);
        const safeHtml = DOMPurify.sanitize(rawHtml, {
          ADD_ATTR: ["target", "rel"]
        });
        const container = document.createElement("div");
        container.innerHTML = safeHtml;

        container.querySelectorAll("a").forEach(a => {
          const href = a.getAttribute("href") || "";
          if (!/^https?:\/\//i.test(href)) {
            a.removeAttribute("href");
            return;
          }
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });

        if (window.hljs) {
          container.querySelectorAll("pre code").forEach(el => {
            try { hljs.highlightElement(el); } catch (_) {}
          });
        }
        return container.innerHTML;
      }
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    /* ---------- 只允许 http/https 的跳转链接 ---------- */
    function isSafeUrl(u) {
      try {
        const parsed = new URL(u, window.location.origin);
        return parsed.protocol === "http:" || parsed.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    /* ---------- 消息渲染 ---------- */
    function addMessage(role, text, navigation) {
      if (emptyEl && emptyEl.parentNode) emptyEl.remove();

      const msg = document.createElement("div");
      msg.className = "msg " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "我" : "AI";

      const body = document.createElement("div");
      body.className = "body";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "assistant") {
        bubble.innerHTML = renderMarkdown(text);
      } else {
        bubble.textContent = text;
      }

      if (navigation && navigation.label) {
        const url = navigation.url || "";
        if (isSafeUrl(url)) {
          const card = document.createElement("a");
          card.className = "nav-card";
          card.href = url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";

          const arrow = document.createElement("span");
          arrow.className = "arrow";
          arrow.textContent = "↗";

          const label = document.createElement("span");
          label.textContent = navigation.label;

          const hint = document.createElement("span");
          hint.className = "url-hint";
          hint.textContent = url;

          card.append(arrow, label, hint);
          bubble.appendChild(document.createElement("br"));
          bubble.appendChild(card);
        }
      }

      body.appendChild(bubble);
      msg.append(avatar, body);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addTyping() {
      const msg = document.createElement("div");
      msg.className = "msg assistant";
      msg.id = "typing-msg";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = "AI";

      const body = document.createElement("div");
      body.className = "body";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      body.appendChild(bubble);
      msg.append(avatar, body);
      chatEl.appendChild(msg);
      chatEl.scrollTop = chatEl.scrollHeight;
      return msg;
    }

    /* ---------- 输入框自适应高度 ---------- */
    function autoResize() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    }
    inputEl.addEventListener("input", autoResize);

    /* ---------- 发送 ---------- */
    async function send(text) {
      text = (text ?? inputEl.value).trim();
      if (!text || busy || !clientId) return;

      setBusy(true);
      inputEl.value = "";
      autoResize();

      addMessage("user", text);
      const typingMsg = addTyping();

      try {
        if (!sessionId) {
          const bytes = crypto.getRandomValues(new Uint8Array(16));
          sessionId = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          localStorage.setItem(ACTIVE_SESSION_KEY, sessionId);
        }
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Client-Id": clientId },
          body: JSON.stringify({ message: text, session_id: sessionId })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const data = await res.json();
        if (data.session_id) {
          sessionId = data.session_id;
          localStorage.setItem(ACTIVE_SESSION_KEY, sessionId);
        }

        typingMsg.remove();
        addMessage("assistant", data.reply || "(无回复)", data.navigation);
        openNavigation(data.navigation);
        try {
          await refreshSessions();
        } catch (error) {
          sessionStatusEl.textContent = "刷新历史会话失败：" + error.message;
        }
      } catch (e) {
        typingMsg.remove();
        addMessage("assistant", "⚠️ 请求失败：" + e.message + "\n\n请检查后端服务是否在运行，以及终端是否有报错。");
        try {
          await refreshSessions();
        } catch (error) {
          sessionStatusEl.textContent = "刷新历史会话失败：" + error.message;
        }
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    sendEl.addEventListener("click", () => send());
    newSessionEl.addEventListener("click", newSession);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        send();
      }
    });

    loadSuggestions();
    setBusy(true);
    initializeSessions();
    inputEl.focus();
  </script>
</body>
</html>
